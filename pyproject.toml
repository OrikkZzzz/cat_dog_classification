[project]
name = "cat_dog_classification"
version = "0.1.0"
description = "PyTorch 手写 VGG16 / ResNet / SE-ResNet，在猫狗数据集上做迁移学习"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "OrikkZzzz", email = "916108544@qq.com" }
]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

ignore = ["E501"]
